name: Refresh frontend lockfile (temporary)

on:
  push:
    branches:
      - rebuild/v2-security
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v2-security
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve dependencies without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "Refresh frontend dependency lockfile"
            git push origin HEAD:rebuild/v2-security
          fi
