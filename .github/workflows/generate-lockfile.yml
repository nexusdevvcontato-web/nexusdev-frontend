name: Generate frontend lockfile

on:
  push:
    branches:
      - rebuild/v2-security
    paths:
      - package.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/rebuild/v2-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/v2-security
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve and write lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "Add reproducible frontend dependency lockfile"
            git push origin HEAD:rebuild/v2-security
          fi
