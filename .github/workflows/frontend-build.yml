name: Frontend build and security checks

on:
  push:
    branches:
      - rebuild/v2-security
  pull_request:
    branches:
      - rebuild/v2-security

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const audit = require('/tmp/npm-audit.json'); console.log(JSON.stringify(audit.vulnerabilities || {}, null, 2))"
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run build
