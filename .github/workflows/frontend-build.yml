name: Frontend build

on:
  push:
    branches:
      - rebuild/v2-security
  pull_request:
    branches:
      - rebuild/v2-security

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
